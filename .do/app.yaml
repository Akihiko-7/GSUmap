# DigitalOcean App Platform spec. Deploy with: doctl apps create --spec .do/app.yaml
# Change the repo to yours, then set GEMINI_API_KEY and ADMIN_PIN as encrypted values in the dashboard.
name: gsu-compass
region: fra
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: YOUR_GITHUB_USER/GSU-Compass
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PIN
        scope: RUN_TIME
        type: SECRET
      - key: AI_TIMEOUT
        scope: RUN_TIME
        value: "30"
